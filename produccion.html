<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Showtime · Producción</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a1a;
  color: #e0e0e0;
  overflow: hidden;
  height: 100vh;
}
#header {
  background: #242424;
  border-bottom: 1px solid #333;
  padding: 12px 16px;
  font-size: 14px;
}
#producer-name { 
  font-weight: 700;
  color: #4fc3f7;
}
#status {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}
#container {
  display: flex;
  height: calc(100vh - 60px);
  gap: 12px;
  padding: 12px;
}
#schedule {
  flex: 1;
  overflow-y: auto;
  background: #1f1f1f;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px;
  font-size: 12px;
}
.evt-row {
  display: grid;
  grid-template-columns: 70px 1fr 80px 80px;
  gap: 8px;
  padding: 8px;
  border-bottom: 1px solid #2a2a2a;
  align-items: center;
}
.evt-row:hover { background: rgba(255,255,255,.02); }
.evt-time { color: #999; font-weight: 600; }
.evt-task { color: #e0e0e0; }
.evt-stage { color: #a0a0a0; font-size: 11px; }
.evt-call { background: #d32f2f; color: white; padding: 4px 8px; border-radius: 3px; text-align: center; font-weight: 600; cursor: pointer; border: none; }
.evt-call:hover { background: #e53935; }
#chat {
  width: 280px;
  display: flex;
  flex-direction: column;
  background: #1f1f1f;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px;
}
#chat-header {
  font-weight: 700;
  font-size: 12px;
  color: #999;
  margin-bottom: 8px;
}
#chat-messages {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 8px;
  font-size: 11px;
}
.msg {
  margin-bottom: 6px;
  padding: 6px;
  background: rgba(255,255,255,.04);
  border-left: 2px solid #4fc3f7;
  border-radius: 3px;
  line-height: 1.3;
}
.msg-from {
  color: #4fc3f7;
  font-weight: 600;
  font-size: 10px;
  margin-bottom: 2px;
}
.msg-text { color: #e0e0e0; }
#chat-input {
  display: flex;
  gap: 6px;
}
#msg-box {
  flex: 1;
  padding: 6px 8px;
  background: rgba(255,255,255,.08);
  border: 1px solid #333;
  border-radius: 4px;
  color: #e0e0e0;
  font-size: 11px;
}
#msg-box:focus { outline: none; border-color: #4fc3f7; }
#msg-send {
  padding: 6px 12px;
  background: #4fc3f7;
  color: #000;
  border: none;
  border-radius: 4px;
  font-weight: 600;
  font-size: 11px;
  cursor: pointer;
}
#msg-send:hover { background: #29b6f6; }
.error {
  background: #d32f2f;
  padding: 12px;
  border-radius: 6px;
  color: white;
  margin: 12px;
}
</style>
</head>
<body>

<div id="header">
  <div id="producer-name">Producción: conectando...</div>
  <div id="status">Sala: —</div>
</div>

<div id="container">
  <div id="schedule"></div>
  <div id="chat">
    <div id="chat-header">Chat con Stage Manager</div>
    <div id="chat-messages"></div>
    <div id="chat-input">
      <input type="text" id="msg-box" placeholder="Mensaje..." />
      <button id="msg-send">Enviar</button>
    </div>
  </div>
</div>

<script src="emision.js?v=20261024"></script>
<script src="datos.js?v=20261024"></script>
<script src="core.js?v=20261024"></script>
<script>
'use strict';

const Em = typeof ShowtimeEmision !== 'undefined' ? ShowtimeEmision : {};
let RX = null, room = null, prodId = null;

function parseHash() {
  const h = String(location.hash || '').replace(/^#/, '');
  const o = {};
  h.split('&').forEach(kv => {
    const i = kv.indexOf('=');
    if (i > 0) o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  return o;
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = String(s || '');
  return div.innerHTML;
}

function show(selector, content) {
  const el = document.querySelector(selector);
  if (!el) return;
  if (typeof content === 'string') el.innerHTML = content;
  return el;
}

function $(id) { return document.getElementById(id); }

async function init() {
  const hash = parseHash();
  const sala = hash.sala, k = hash.k, p = hash.p, id = hash.id;
  prodId = id;

  if (!sala || !k || !p) {
    show('#schedule', '<div class="error">QR inválido: faltan parámetros</div>');
    return;
  }

  const decodeB64 = (s) => {
    const b = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
    const bin = typeof atob === 'function' ? atob(b) : Buffer.from(b, 'base64').toString('binary');
    return new Uint8Array(bin.split('').map(c => c.charCodeAt(0)));
  };

  const kKey = decodeB64(k);
  const pKey = decodeB64(p);

  if (!kKey || kKey.length !== 16 || !pKey || pKey.length !== 16) {
    show('#schedule', '<div class="error">Claves inválidas</div>');
    return;
  }

  room = { sala, k: kKey, p: pKey };
  $('producer-name').textContent = 'Producción: ' + esc(prodId);
  $('status').textContent = 'Sala: ' + esc(sala.slice(0, 8)) + '...';

  if (Em.Receptor) {
    RX = new Em.Receptor({
      room: room,
      onStatus: (status) => {
        const statusTxt = status.connected ? 'Conectado' : 'Desconectado';
        const viewers = status.viewers || 0;
        $('status').textContent = 'Sala: ' + esc(sala.slice(0, 8)) + '... · ' + statusTxt + ' · ' + viewers + ' dispositivos';
      },
      onSnapshot: renderSchedule
    });
  }

  renderSchedule();
  setupChat();
}

function renderSchedule() {
  if (!RX || !RX.snapshot) {
    show('#schedule', '<div style="color: #999; text-align: center; padding: 20px;">Conectando...</div>');
    return;
  }

  const festival = RX.snapshot.festival || {};
  const schedule = (festival.jornadas && festival.jornadas[0] && festival.jornadas[0].eventos) || [];

  let html = '<div style="font-weight: 600; margin-bottom: 12px; color: #999; font-size: 11px;">EVENTO · ACTO</div>';
  
  if (!schedule.length) {
    html += '<div style="color: #666; text-align: center; padding: 20px;">Sin eventos</div>';
  } else {
    schedule.forEach(evt => {
      const prevTime = evt.previsto || '—';
      const initTime = evt.inicio || '—';
      const task = evt.acto || '—';
      const stage = evt.escena || evt.stage || '—';
      const callDone = evt.callDone;

      html += '<div class="evt-row">'
        + '<div class="evt-time">' + esc(prevTime) + '</div>'
        + '<div><div class="evt-task">' + esc(task) + '</div><div class="evt-stage">' + esc(stage) + '</div></div>'
        + '<div class="evt-time">' + esc(initTime) + '</div>'
        + '<button class="evt-call" data-evt-id="' + esc(evt.id || '') + '" style="background: ' + (callDone ? '#4caf50' : '#d32f2f') + '">'
        + (callDone ? '✓ OK' : 'CALL') + '</button>'
        + '</div>';
    });
  }

  show('#schedule', html);

  document.querySelectorAll('.evt-call').forEach(btn => {
    btn.addEventListener('click', handleCallClick);
  });
}

function handleCallClick(e) {
  const evtId = e.target.dataset.evtId;
  if (!evtId) return;
  console.log('CALL confirmado:', evtId);
  toast('CALL confirmado');
}

function setupChat() {
  const msgBox = $('msg-box');
  const msgSend = $('msg-send');

  msgSend.addEventListener('click', sendMessage);
  msgBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

function sendMessage() {
  const msgBox = $('msg-box');
  const text = msgBox.value.trim();
  if (!text) return;

  addMessageToChat(prodId, text);
  msgBox.value = '';
  msgBox.focus();
}

function addMessageToChat(from, text) {
  const container = $('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = '<div class="msg-from">' + esc(from) + '</div><div class="msg-text">' + esc(text) + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function toast(msg) {
  const banner = document.createElement('div');
  banner.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #4caf50; color: white; padding: 12px 20px; border-radius: 6px; font-size: 12px; z-index: 9999;';
  banner.textContent = msg;
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 3000);
}

init().catch(err => {
  console.error(err);
  show('#schedule', '<div class="error">Error: ' + esc(err.message) + '</div>');
});
</script>
</body>
</html>
