<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Showtime">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="robots" content="noindex">
<title>Showtime · Mando</title>
<link rel="stylesheet" href="remote.css?v=20261046">
</head>
<body>

<!-- Iconos SVG (sin emojis) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-stretch" viewBox="0 0 20 20"><path d="M3 10h10.5M10.5 6.5 14 10l-3.5 3.5M17 4.5v11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 6v4.3l2.8 1.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3l8 14H2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1" fill="currentColor"/></symbol>
  <symbol id="i-bell" viewBox="0 0 20 20"><path d="M5.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5l1.5 2h-12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 17.5a1.6 1.6 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-msg" viewBox="0 0 20 20"><path d="M4 5.5h12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9l-3.5 3v-3H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 20 20"><path d="M7 6.5H12a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.5 3.5L6.5 6.5l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="rh">
  <div class="rh-top">
    <span class="brand">SHOWTIME</span><span class="tag">MANDO</span>
    <span id="rx" class="rx connecting"><span class="rx-dot"></span><span id="rx-t">CONECTANDO…</span></span>
  </div>
  <div class="rh-mid"><div id="clk" class="clk">--:--:--</div><div id="evn" class="evn"></div></div>
</header>

<main id="app">
  <!-- CALL activos (arriba: es lo urgente) -->
  <section id="calls" class="calls" hidden></section>

  <!-- Banda sobre la que actúan ▶ / ■ / En hora -->
  <section class="card">
    <div id="zones" class="zones" role="tablist" aria-label="Zona"></div>
    <div class="bnav">
      <button id="prev" class="nav" aria-label="Banda anterior"><svg class="ic"><use href="#i-left"/></svg></button>
      <div id="band" class="binfo"></div>
      <button id="next" class="nav" aria-label="Banda siguiente"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
    <div id="drift" class="drift"></div>
  </section>

  <!-- Retrasos: siempre con resumen y Confirmar -->
  <section class="card">
    <h2>Retraso</h2>
    <div class="row3">
      <button class="tbtn" data-delay="5">+5 min</button>
      <button class="tbtn" data-delay="10">+10 min</button>
      <button class="tbtn" data-delay="n">+N min</button>
    </div>
    <p id="delay-hint" class="hint"></p>
  </section>

  <!-- Prompter -->
  <section class="card">
    <h2>Mensaje a escena</h2>
    <div class="seg4" id="msg-to" role="group" aria-label="Destino"><button data-to="all" class="on">Todas</button><button data-to="confidence">Confidence</button><button data-to="backstage">Backstage</button><button data-to="manager">Manager</button></div>
    <div id="msg-zones" class="mzones" hidden><span>Confidence en</span><div id="msg-zl" class="zrow"></div></div>
    <div id="flash-cur" class="flash-cur" hidden></div>
    <div class="row2">
      <button class="tbtn msgp" data-msg="5 MINUTOS">5 MINUTOS</button>
      <button class="tbtn msgp" data-msg="ÚLTIMO TEMA">ÚLTIMO TEMA</button>
    </div>
    <form id="msg-form" class="msgf" autocomplete="off">
      <input id="msg-text" type="text" maxlength="140" placeholder="Aviso libre…" enterkeyhint="send" spellcheck="false">
      <button class="tbtn send" type="submit">Enviar</button>
    </form>
  </section>
  <p class="foot">Las órdenes las ejecuta el Dashboard del Mac (quedan en su Deshacer). Este enlace es privado.</p>
</main>

<!-- Botonera al pulgar -->
<nav class="actbar" aria-label="Actividad">
  <button id="b-start" class="act start"><svg class="ic"><use href="#i-play"/></svg><span>EMPEZAR</span></button>
  <button id="b-stop" class="act stop"><svg class="ic"><use href="#i-stop"/></svg><span>TERMINAR</span></button>
  <button id="b-ontime" class="act ontime"><svg class="ic"><use href="#i-undo"/></svg><span>EN HORA</span></button>
</nav>

<!-- Hoja de confirmación (resúmenes) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h3 id="sh-t"></h3>
    <div id="sh-b" class="sh-b"></div>
    <div class="sheet-acts"><button id="sh-no" class="tbtn">Cancelar</button><button id="sh-yes" class="tbtn primary">Confirmar</button></div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<div id="bad" class="badlink" hidden><svg class="ic"><use href="#i-alert"/></svg><b>Enlace no válido</b><span id="bad-t">Escanea el QR del Stage Manager (Dashboard › Emisión › Stage Manager · mando).</span></div>

<script src="core.js?v=20261046"></script>
<script src="datos.js?v=20261046"></script>
<script src="emision.js?v=20261046"></script>
<script src="mando.js?v=20261046"></script>
<script src="remote.js?v=20261046"></script>
<script src="pwa.js?v=20261046"></script>
</body>
</html>
