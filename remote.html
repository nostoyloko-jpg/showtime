<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Showtime">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="robots" content="noindex">
<title>Showtime · Mando</title>
<link rel="stylesheet" href="remote.css?v=20261144">
</head>
<body>

<!-- Iconos SVG (sin emojis) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-stretch" viewBox="0 0 20 20"><path d="M3 10h10.5M10.5 6.5 14 10l-3.5 3.5M17 4.5v11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 6v4.3l2.8 1.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3l8 14H2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1" fill="currentColor"/></symbol>
  <symbol id="i-bell" viewBox="0 0 20 20"><path d="M5.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5l1.5 2h-12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 17.5a1.6 1.6 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-msg" viewBox="0 0 20 20"><path d="M4 5.5h12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9l-3.5 3v-3H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 20 20"><path d="M7 6.5H12a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.5 3.5L6.5 6.5l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="rh">
  <div class="rh-top">
    <span class="brand">SHOWTIME</span><span class="tag" data-i18n>MANDO</span><span id="zlock" class="zlock" hidden></span>
    <span id="rx" class="rx connecting"><span class="rx-dot"></span><span id="rx-t">CONECTANDO…</span></span>
  </div>
  <div class="rh-mid"><div id="clk" class="clk">--:--:--</div><div id="evn" class="evn"></div></div>
</header>

<main id="app">
<div class="col-l">
  <!-- CALL activos (arriba: es lo urgente) -->
  <section id="calls" class="calls" hidden></section>

  <!-- Banda sobre la que actúan ▶ / ■ / En hora -->
  <section class="card">
    <div id="zones" class="zones" role="tablist" aria-label="Zona" data-i18n-aria></div>
    <div class="bnav">
      <button id="prev" class="nav" aria-label="Banda anterior" data-i18n-aria><svg class="ic"><use href="#i-left"/></svg></button>
      <div id="band" class="binfo"></div>
      <button id="next" class="nav" aria-label="Banda siguiente" data-i18n-aria><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
    <div id="drift" class="drift"></div>
  </section>

</div>
<div class="col-r">
  <!-- Retrasos: siempre con resumen y Confirmar -->
  <section class="card">
    <h2 data-i18n>Retraso</h2>
    <div class="row3">
      <button class="tbtn" data-delay="5" data-i18n>+5 min</button>
      <button class="tbtn" data-delay="10" data-i18n>+10 min</button>
      <button class="tbtn" data-delay="n" data-i18n>+N min</button>
    </div>
    <p id="delay-hint" class="hint"></p>
  </section>

  <!-- Prompter -->
  <section class="card">
    <h2 data-i18n>Mensaje a escena</h2>
    <div class="seg4" id="msg-to" role="group" aria-label="Destino" data-i18n-aria><button data-to="all" class="on" data-i18n>Todas</button><button data-to="confidence" data-i18n>Confidence</button><button data-to="backstage" data-i18n>Backstage</button><button data-to="manager" data-i18n>Manager</button></div>
    <div id="msg-zones" class="mzones" hidden><span data-i18n>Confidence en</span><div id="msg-zl" class="zrow"></div></div>
    <div id="flash-cur" class="flash-cur" hidden></div>
    <div class="row2">
      <button class="tbtn msgp" data-msg="5 MINUTOS" data-i18n>5 MINUTOS</button>
      <button class="tbtn msgp" data-msg="ÚLTIMO TEMA" data-i18n>ÚLTIMO TEMA</button>
    </div>
    <form id="msg-form" class="msgf" autocomplete="off">
      <input id="msg-text" type="text" maxlength="140" placeholder="Aviso libre…" enterkeyhint="send" spellcheck="false" data-i18n-placeholder>
      <button class="tbtn send" type="submit" data-i18n>Enviar</button>
    </form>
  </section>
</div>
  <p class="foot" data-i18n>Las órdenes las ejecuta el Dashboard del Mac (quedan en su Deshacer). Este enlace es privado.</p>
</main>

<!-- Botonera al pulgar: SIEMPRE abajo, en vertical y en horizontal (así no hace falta scroll) -->
<nav class="actbar" aria-label="Actividad" data-i18n-aria>
  <button id="b-start" class="act start"><svg class="ic"><use href="#i-play"/></svg><span data-i18n>EMPEZAR</span></button>
  <button id="b-stop" class="act stop"><svg class="ic"><use href="#i-stop"/></svg><span data-i18n>TERMINAR</span></button>
  <button id="b-ontime" class="act ontime"><svg class="ic"><use href="#i-undo"/></svg><span data-i18n>EN HORA</span></button>
</nav>


<!-- Hoja de confirmación (resúmenes) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h3 id="sh-t"></h3>
    <div id="sh-b" class="sh-b"></div>
    <div class="sheet-acts"><button id="sh-no" class="tbtn" data-i18n>Cancelar</button><button id="sh-yes" class="tbtn primary">Confirmar</button></div>
  </div>
</div>

<!-- Chat de Producción (dec. 104): botón flotante y hoja de altura fija (la lista hace scroll; el campo queda fijo al pie) -->
<button id="chat-fab" class="chat-fab" type="button" aria-label="Chat de Producción" title="Chat de Producción" data-i18n-aria data-i18n-title><svg class="ic"><use href="#i-msg"/></svg><i id="chat-dot" class="chat-dot" hidden></i></button>
<div id="chat-sheet" class="csheet" hidden>
  <div class="csheet-box" role="dialog" aria-modal="true" aria-labelledby="chat-t">
    <div class="csh-h"><h3 id="chat-t" data-i18n>Chat de Producción</h3><button id="chat-x" class="csh-x" type="button" aria-label="Cerrar" data-i18n-aria><svg class="ic"><use href="#i-x"/></svg></button></div>
    <label class="csh-me"><span id="chat-sig"></span><input id="chat-name" type="text" maxlength="40" placeholder="Tu nombre" autocomplete="off" spellcheck="false" data-i18n-placeholder></label>
    <div id="chat-list" class="csh-list" aria-live="polite"></div>
    <form id="chat-form" class="csh-f" autocomplete="off">
      <input id="chat-text" type="text" maxlength="300" placeholder="Escribe a Producción…" enterkeyhint="send" data-i18n-placeholder>
      <button class="tbtn send" type="submit" data-i18n>Enviar</button>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<div id="bad" class="badlink" hidden><svg class="ic"><use href="#i-alert"/></svg><b data-i18n>Enlace no válido</b><span id="bad-t" data-i18n>Escanea el QR del Stage Manager (Dashboard › Pantallas y Emisión › Stage Manager).</span></div>

<script src="i18n.js?v=20261144"></script>
<script src="core.js?v=20261144"></script>
<script src="datos.js?v=20261144"></script>
<script src="cripto.js?v=20261144"></script>
<script src="emision.js?v=20261144"></script>
<script src="mando.js?v=20261144"></script>
<script src="remote.js?v=20261144"></script>
<script src="pwa.js?v=20261144"></script>
</body>
</html>
