<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Showtime">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Showtime · Pantalla Live</title>
<link rel="stylesheet" href="live.css?v=20261105">
<link rel="stylesheet" href="marca.css?v=20261105">
</head>
<body>

<!-- Iconos SVG (sin emojis: se ven igual en cualquier sistema) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-full" viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-screen" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 17h6M10 13.5V17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-swap" viewBox="0 0 20 20"><path d="M4 7.5h11.5M12.5 4.5l3 3-3 3M16 12.5H4.5M7.5 9.5l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pause" viewBox="0 0 20 20"><path d="M7.5 5v10M12.5 5v10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-flag" viewBox="0 0 20 20"><path d="M5 17.5V3.5M5 4h9l-2 3 2 3H5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 6v4.3l2.8 1.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3.5l7 12.5H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8.5v3.5M10 14.2v.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 20 20"><path d="M5.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5l1.5 2h-12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 17.5a1.6 1.6 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-thermo" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2a1.8 1.8 0 0 0-1.8 1.8v6.8a3.3 3.3 0 1 0 3.6 0V5A1.8 1.8 0 0 0 10 3.2z"/><path d="M10 8.5v5.2"/></g></symbol>
  <symbol id="i-drop" viewBox="0 0 20 20"><path d="M10 3.2s-4.6 5.1-4.6 8.4a4.6 4.6 0 0 0 9.2 0C14.6 8.3 10 3.2 10 3.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-wind" viewBox="0 0 20 20"><path d="M2.8 8h9.6a2.5 2.5 0 1 0-2.5-2.5M2.8 11.5h12.2a2.5 2.5 0 1 1-2.5 2.5M2.8 15h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 20 20"><path d="M6 15.5h8.6a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.6 1.4A2.8 2.8 0 0 0 6 15.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-csun" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.8v1.3M2.8 7h1.3M4 4l.9.9M10 4l-.9.9"/><path d="M4.9 9.3a2.6 2.6 0 0 1 4.7-2.1"/><path d="M7.6 16.5h7.2a3 3 0 0 0 .2-6 4.3 4.3 0 0 0-8.2 1.3 2.4 2.4 0 0 0 .8 4.7z"/></g></symbol>
  <symbol id="i-rain" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h8.6a3.2 3.2 0 0 0 .3-6.4 4.7 4.7 0 0 0-9.1 1.3A2.6 2.6 0 0 0 6 12z"/><path d="M7.2 14.5l-.9 2.3M10.6 14.5l-.9 2.3M14 14.5l-.9 2.3"/></g></symbol>
  <symbol id="i-snow" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h8.6a3.2 3.2 0 0 0 .3-6.4 4.7 4.7 0 0 0-9.1 1.3A2.6 2.6 0 0 0 6 12z"/><path d="M7 15.2v.1M10 16.5v.1M13 15.2v.1"/></g></symbol>
  <symbol id="i-storm" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h8.6a3.2 3.2 0 0 0 .3-6.4 4.7 4.7 0 0 0-9.1 1.3A2.6 2.6 0 0 0 6 12z"/><path d="M10.6 12.6l-2 3h3l-2 3"/></g></symbol>
  <symbol id="i-ext" viewBox="0 0 20 20"><path d="M11.5 3.5h5v5M16.5 3.5l-7 7M14 11.5v4a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-msg" viewBox="0 0 20 20"><path d="M4 5.5h12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9l-3.5 3v-3H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-chat" viewBox="0 0 20 20"><path d="M3 4.5h9.5a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H8l-3 2.5V12H3a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 7.5H17a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1h-1v2.5L13 15h-3.5a1 1 0 0 1-1-1v-.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>

<div id="banner" role="status" hidden></div>

<!-- Modo Staff (QR, solo lectura): estado de la conexión con la sala -->
<div id="rx" class="rx" role="status" hidden><span class="rx-dot"></span><span id="rx-t"></span></div>

<button id="close" class="iconbtn" title="Cerrar la Pantalla Live" hidden><svg class="ic"><use href="#i-x"/></svg></button>

<div id="top">
  <div id="clkbox">
    <div id="clk">00:00</div>
    <div id="dat"></div>
    <div id="evn"><span id="evn-mode"></span><span id="evn-name"></span></div>
    <div id="drift"></div>
    <div id="meteo" class="mtpill"></div>
  </div>
  <div class="vsplit" data-vs="0" title="Arrastra para ajustar el ancho"></div>
  <div id="panel-now" class="tpanel">
    <div class="tpanel-h">EN ESCENA</div>
    <div class="tpanel-b" id="now-list"><div class="tempty">—</div></div>
  </div>
  <div class="vsplit" data-vs="1" title="Arrastra para ajustar el ancho"></div>
  <div id="panel-next" class="tpanel">
    <div class="tpanel-h">SIGUIENTE</div>
    <div class="tpanel-b" id="next-list"><div class="tempty">—</div></div>
  </div>
  <div class="vsplit" data-vs="2" title="Arrastra para ajustar el ancho"></div>
  <div id="panel-call" class="tpanel">
    <div class="tpanel-h">CALL</div>
    <div class="tpanel-b" id="call-list"></div>
  </div>
</div>
<div id="hsplit" title="Arrastra para ver más artistas"></div>
<div id="bot"></div>

<!-- Backstage: cinta de avisos (retrasos, hitos, tiempo) -->
<div id="ticker" class="ticker"></div>

<!-- Confidence: monitor de escenario de UNA zona (cuenta atrás gigante con semáforo) -->
<div id="conf" class="conf"></div>
<button id="cf-full" class="iconbtn cf-full" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg class="ic"><use href="#i-full"/></svg></button>

<!-- Standby / Modo Cartel: el cartel de Showtime a pantalla completa y la hora (descansos, pausas técnicas, antes de puertas). Tecla S. -->
<div id="standby" class="standby" hidden></div>

<!-- Mensaje flash (2c-C): enorme, parpadea; se cierra solo (duración en Configuración → Mensajes) o con el botón -->
<div id="flash" role="alert" hidden><div class="fl-box"><div id="flash-txt"></div><div class="fl-bar"><div id="flash-prog"></div></div></div><button id="flash-x" class="iconbtn" title="Cerrar mensaje"><svg class="ic"><use href="#i-x"/></svg></button></div>

<!-- Controles plegados: un icono; al dejar el cursor encima (o al tocarlo) se despliegan -->
<div id="zoomctl" class="dock">
  <div id="dockbody">
  <span id="wake" title="Mientras esta ventana esté abierta, el equipo no apagará la pantalla ni entrará en reposo" hidden><svg class="ic"><use href="#i-screen"/></svg>Sin reposo</span>
  <button id="syncbtn" class="iconbtn" title="Volver al momento actual"><svg class="ic"><use href="#i-now"/></svg></button>
  <span id="offlbl"></span>
  <button id="rmin" class="iconbtn" title="Filas más bajas (todas por igual)"><svg class="ic"><use href="#i-minus"/></svg></button>
  <button id="rlbl" class="txtbtn" title="Alto de las filas. Clic: automático">alto auto</button>
  <button id="rmax" class="iconbtn" title="Filas más altas (todas por igual)"><svg class="ic"><use href="#i-plus"/></svg></button>
  <span class="zsep"></span>
  <button id="zmin" class="iconbtn" title="Más tiempo visible"><svg class="ic"><use href="#i-plus"/></svg></button>
  <span id="zlbl"></span>
  <button id="zmax" class="iconbtn" title="Menos tiempo visible"><svg class="ic"><use href="#i-minus"/></svg></button>
  <button id="stbbtn" class="iconbtn" title="Standby · Modo Cartel: el cartel de Showtime y la hora (S)" aria-pressed="false"><svg class="ic"><use href="#i-pause"/></svg></button>
  <button id="fullbtn" class="iconbtn" title="Pantalla completa (F)"><svg class="ic"><use href="#i-full"/></svg></button>
  </div>
  <span id="docktag" title="La línea de tiempo está desplazada"></span>
  <button id="dockbtn" class="iconbtn" title="Controles (zoom, volver a ahora, pantalla completa)" aria-expanded="false"><svg class="ic"><use href="#i-sliders"/></svg></button>
</div>

<!-- Producción (enlace con «id»): menú de mensajes plegado a la izquierda; se despliega al pasar el cursor o al tocarlo -->
<div id="pnote" class="pnote" role="status" hidden></div>
<div id="msgdock" class="mdock" hidden>
  <div id="mdbody">
    <div id="md-to" class="md-to" role="group" aria-label="Destino del mensaje"><button type="button" data-to="all" class="on">Todas</button><button type="button" data-to="manager">Manager</button><button type="button" data-to="backstage">Backstage</button></div>
    <form id="md-form" autocomplete="off"><input id="md-text" type="text" maxlength="140" placeholder="Mensaje a las pantallas Live…" spellcheck="false" enterkeyhint="send"><button class="txtbtn md-send" type="submit">Enviar</button></form>
  </div>
  <button id="mdbtn" class="iconbtn" type="button" title="Mensajes a las pantallas Live" aria-expanded="false"><svg class="ic"><use href="#i-msg"/></svg></button>
</div>

<!-- Producción: chat con el Stage Manager (se abre y se cierra con su icono; un punto avisa de mensajes sin leer) -->
<div id="chatdock" class="cdock" hidden>
  <div id="cdbody">
    <div class="cd-h">Chat con Stage Manager</div>
    <div id="cd-list" class="cd-list"></div>
    <form id="cd-form" autocomplete="off"><input id="cd-text" type="text" maxlength="300" placeholder="Escribe al Stage Manager…" spellcheck="false" enterkeyhint="send"><button class="txtbtn md-send" type="submit">Enviar</button></form>
  </div>
  <button id="cdbtn" class="iconbtn" type="button" title="Chat con el Stage Manager" aria-expanded="false"><svg class="ic"><use href="#i-chat"/></svg><span id="cd-dot" class="cd-dot" hidden></span></button>
</div>

<!-- Producción: al enviar, se elige dónde va el mensaje -->
<div id="pmodal" class="pmodal" hidden>
  <div class="pm-box" role="dialog" aria-modal="true" aria-labelledby="pm-t">
    <div id="pm-t" class="pm-t">¿Dónde lo mandas?</div>
    <div id="pm-txt" class="pm-txt"></div>
    <div class="pm-opts">
      <button type="button" data-pm="live"><b>Ventanas Live</b><small id="pm-live-sub">Mensaje grande en Manager y Backstage</small></button>
      <button type="button" data-pm="aviso"><b>Aviso puntual</b><small>En amarillo en la cinta de Backstage y en el Dashboard · se quita solo (2 min por defecto)</small></button>
      <button type="button" data-pm="perm"><b>Aviso permanente</b><small>Se queda en la cinta hasta que lo quite el Stage Manager</small></button>
    </div>
    <button type="button" class="txtbtn pm-no" data-pm="no">Cancelar</button>
  </div>
</div>

<script src="i18n.js?v=20261105"></script>
<script src="core.js?v=20261105"></script>
<script src="meteo.js?v=20261105"></script>
<script src="datos.js?v=20261105"></script>
<script src="emision.js?v=20261105"></script>
<script src="vistas.js?v=20261105"></script>
<script src="marca.js?v=20261105"></script>
<script src="live.js?v=20261105"></script>
<script src="pwa.js?v=20261105"></script>
</body>
</html>
